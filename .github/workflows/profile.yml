name: Atualizar o mapa de contribuições
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/profile/**', '.github/workflows/profile.yml']
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler o repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Conferir o gerador
        run: python3 -m unittest discover -s .github/profile -p 'test_*.py'
      - name: Atualizar a atividade real
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/profile/build.py --activity-only
      - name: Publicar somente os mapas
        run: |
          if git diff --quiet -- assets/activity.svg assets/activity-mobile.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/activity.svg assets/activity-mobile.svg
          git commit -m 'chore(profile): refresh contribution artwork [skip ci]'
          git push origin HEAD:main

