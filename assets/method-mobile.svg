<svg xmlns="http://www.w3.org/2000/svg" width="640" height="910" viewBox="0 0 640 910" role="img" aria-labelledby="title desc" fill="none"><title id="title">Entender, construir e conferir. Explorar repositórios.</title><desc id="desc">Entender, construir e conferir. Explorar repositórios.</desc><style>@media(prefers-reduced-motion:reduce){.snake{animation:none!important}.motion{display:none}}</style><path fill="#171B17" d="M0 0h640v910H0z"/><path fill="#C4F464" d="M0 0h8v910H0z"/><text x="32" y="100" fill="#F3F0DF" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="800" letter-spacing="-1.7" text-anchor="start">POR BAIXO</text><text x="32" y="165" fill="#F3F0DF" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="800" letter-spacing="-1.7" text-anchor="start">DA INTERFACE.</text><text x="34" y="251" fill="#C4F464" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" letter-spacing="0" text-anchor="start">ENTENDER</text><text x="34" y="298" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">O domínio vem antes da</text><text x="34" y="336" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">estrutura de pastas.</text><text x="34" y="422" fill="#C4F464" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" letter-spacing="0" text-anchor="start">CONSTRUIR</text><text x="34" y="469" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">Permissões, estados e recuperação</text><text x="34" y="507" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">fazem parte da experiência.</text><text x="34" y="593" fill="#C4F464" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" letter-spacing="0" text-anchor="start">CONFERIR</text><text x="34" y="640" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">Testar o comportamento, olhar</text><text x="34" y="678" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">a interface e voltar aos detalhes.</text><path d="M34 765L606 765" stroke="#434B3D" stroke-width="1"/><text x="34" y="819" fill="#F3F0DF" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="800" letter-spacing="0" text-anchor="start">CONTINUA NO CÓDIGO.</text><path d="M550 824l38 -38m-38 0h38v38" stroke="#C4F464" stroke-width="3" fill="none"/><text x="34" y="869" fill="#C4F464" font-family="'Courier New',monospace" font-size="17" font-weight="400" letter-spacing="1" text-anchor="start">MOMENTS342 / REPOSITÓRIOS</text></svg>
