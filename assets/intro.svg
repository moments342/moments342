<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc" fill="none"><title id="title">Gabriel Francisconi — Eu junto as peças</title><desc id="desc">Gabriel Francisconi — Eu junto as peças</desc><style>@media(prefers-reduced-motion:reduce){.snake{animation:none!important}.motion{display:none}}</style><path fill="#171B17" d="M0 0h1280v390H0z"/><path fill="#C4F464" d="M0 0h12v390H0z"/><path d="M54 30L1226 30" stroke="#434B3D" stroke-width="1"/><text x="50" y="135" fill="#F3F0DF" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="800" letter-spacing="-1.7" text-anchor="start">EU JUNTO</text><text x="50" y="217" fill="#F3F0DF" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="800" letter-spacing="-1.7" text-anchor="start">AS PEÇAS.</text><text x="54" y="310" fill="#C4F464" font-family="'Courier New',monospace" font-size="17" font-weight="400" letter-spacing="1" text-anchor="start">GABRIEL FRANCISCONI</text><text x="600" y="110" fill="#F3F0DF" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" letter-spacing="0" text-anchor="start">Da regra de negócio à interface.</text><text x="600" y="151" fill="#F3F0DF" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" letter-spacing="0" text-anchor="start">Da API ao banco de dados.</text><text x="600" y="230" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">Aplicações web, sistemas de gestão</text><text x="600" y="269" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">e automações. Projetos para clientes,</text><text x="600" y="308" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">pesquisa aplicada e experimentos.</text></svg>
