  <g class="mono" font-size="17" letter-spacing=".5" fill="#B8C0AF"><text x="34" y="789">ENTENDER → CONSTRUIR → TESTAR → REFINAR</text><text x="34" y="821">JAVA / TYPESCRIPT / GODOT</text></g>
