<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc" fill="none"><title id="title">Gabriel Francisconi — Eu junto as peças</title><desc id="desc">Gabriel Francisconi — Eu junto as peças</desc><style>@media(prefers-reduced-motion:reduce){.snake{animation:none!important}.motion{display:none}}</style><path fill="#171B17" d="M0 0h640v660H0z"/><path fill="#C4F464" d="M0 0h8v660H0z"/><path d="M34 35L606 35" stroke="#434B3D" stroke-width="1"/><text x="32" y="111" fill="#F3F0DF" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="800" letter-spacing="-1.7" text-anchor="start">EU JUNTO</text><text x="32" y="183" fill="#F3F0DF" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="800" letter-spacing="-1.7" text-anchor="start">AS PEÇAS.</text><text x="34" y="243" fill="#C4F464" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400" letter-spacing="0" text-anchor="start">Da regra de negócio à interface.</text><text x="34" y="283" fill="#C4F464" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400" letter-spacing="0" text-anchor="start">Da API ao banco de dados.</text><text x="34" y="357" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">Sou Gabriel Francisconi.</text><text x="34" y="396" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">Construo aplicações web, sistemas</text><text x="34" y="435" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">de gestão e automações.</text><text x="34" y="474" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start"></text><text x="34" y="513" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">Entre projetos para clientes, pesquisa</text><text x="34" y="552" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">aplicada e experimentos, gosto de</text><text x="34" y="591" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0" text-anchor="start">fazer as peças trabalharem juntas.</text></svg>
