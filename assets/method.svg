<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="495" viewBox="0 0 1280 495" role="img" aria-labelledby="title desc" fill="none"><title id="title">Entender, construir e conferir. Explorar repositórios.</title><desc id="desc">Entender, construir e conferir. Explorar repositórios.</desc><style>@media(prefers-reduced-motion:reduce){.snake{animation:none!important}.motion{display:none}}</style><path fill="#171B17" d="M0 0h1280v495H0z"/><path fill="#C4F464" d="M0 0h12v495H0z"/><text x="50" y="100" fill="#F3F0DF" font-family="Arial,Helvetica,sans-serif" font-size="65" font-weight="800" letter-spacing="-1.7" text-anchor="start">POR BAIXO DA INTERFACE.</text><text x="54" y="194" fill="#C4F464" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" letter-spacing="0" text-anchor="start">ENTENDER</text><text x="54" y="241" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" letter-spacing="0" text-anchor="start">O domínio vem antes da</text><text x="54" y="276" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" letter-spacing="0" text-anchor="start">estrutura de pastas.</text><text x="453" y="194" fill="#C4F464" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" letter-spacing="0" text-anchor="start">CONSTRUIR</text><text x="453" y="241" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" letter-spacing="0" text-anchor="start">Permissões, estados e falhas</text><text x="453" y="276" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" letter-spacing="0" text-anchor="start">fazem parte da experiência.</text><text x="854" y="194" fill="#C4F464" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" letter-spacing="0" text-anchor="start">CONFERIR</text><text x="854" y="241" fill="#B8C0AF" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" 